name: Trial source review age

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate review-age report
        run: node scripts/source-staleness.mjs >> "$GITHUB_STEP_SUMMARY"
